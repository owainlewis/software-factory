# Runs the software factory on GitHub issues.
#
# - Add the label `factory` to an issue to start a run.
# - When the factory needs an answer or an approval, it comments on the issue
#   and adds `factory:waiting`. Reply on the issue to resume.
#
# Copy to .github/workflows/factory.yml and add the ANTHROPIC_API_KEY secret.

name: Software Factory

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: factory-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  factory:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'factory') ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       contains(github.event.issue.labels.*.name, 'factory:waiting') &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          FACTORY_HEADLESS: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: |
            https://github.com/owainlewis/software-factory.git
          plugins: |
            software-factory@software-factory
          prompt: |
            /software-factory:factory ${{ github.event.issue.html_url }}
          claude_args: >-
            --max-turns 300
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Agent,SendMessage,WebFetch"
